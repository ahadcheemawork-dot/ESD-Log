<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ESD Check-in Kiosk</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#161826}
  body{font-family:'Inter',system-ui,sans-serif;color:#e9e9ed}

  @keyframes auroraA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(240px,-140px) scale(1.28)}100%{transform:translate(0,0) scale(1)}}
  @keyframes auroraB{0%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-300px,120px) scale(1)}100%{transform:translate(0,0) scale(1.1)}}
  @keyframes auroraC{0%{transform:translate(0,0) scale(1)}50%{transform:translate(180px,150px) scale(1.32)}100%{transform:translate(0,0) scale(1)}}
  @keyframes readerPulse{0%{transform:scale(1);opacity:.55}70%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
  @keyframes sheen{0%{transform:translate3d(-40%,0,0) rotate(14deg);opacity:0}20%{opacity:.55}80%{opacity:.35}100%{transform:translate3d(140%,0,0) rotate(14deg);opacity:0}}
  @keyframes spinGlow{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes floatUp{0%{transform:translate3d(0,40px,0);opacity:0}15%{opacity:.7}85%{opacity:.5}100%{transform:translate3d(0,-1000px,0);opacity:0}}
  @keyframes logoShine{0%{left:-140%}55%{left:150%}100%{left:150%}}
  @keyframes flagPulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.55)}50%{box-shadow:0 0 0 10px rgba(229,72,77,0)}}
  @keyframes bannerIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}

  /* Sized in JS (fitStage) to the exact viewport pixel dimensions — not
     relying on % / vw / vh resolving correctly through whatever ancestor
     chain this ends up embedded in (preview panels, kiosk shells, etc). */
  /* No flexbox centering — position/scale is computed and set directly
     in JS (fitStage) as an exact translate+scale, so there's no reliance
     on flex/transform-origin math resolving correctly at every aspect
     ratio. */
  #stage-outer{position:absolute;top:0;left:0;background:#161826;overflow:hidden}
  #stage{position:absolute;top:0;left:0;width:1920px;height:1080px;background:#161826;overflow:hidden;transform-origin:top left}

  /* connection banner */
  #connectionBanner{
    display:none;position:absolute;left:0;right:0;top:0;z-index:200;
    padding:14px;background:rgba(220,38,38,.92);border-bottom:1px solid rgba(255,255,255,.2);
    color:#fff;font-weight:600;font-size:18px;text-align:center;animation:bannerIn .3s ease;
  }
  #connectionBanner.show{display:block}
  #connectionBanner.reconnected{background:rgba(22,101,52,.92)}

  /* aurora background */
  #aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;transition:filter .55s ease}
  #aurora.blurred{opacity:.55}
  .aur-a{position:absolute;left:-240px;top:-320px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle,rgba(145,132,217,.34),rgba(145,132,217,0) 70%);animation:auroraA 17s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
  .aur-b{position:absolute;right:-320px;top:-180px;width:1300px;height:1300px;border-radius:50%;background:radial-gradient(circle,rgba(76,83,151,.40),rgba(76,83,151,0) 68%);animation:auroraB 22s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
  .aur-c{position:absolute;left:520px;bottom:-560px;width:1200px;height:1200px;border-radius:50%;background:radial-gradient(circle,rgba(38,42,96,.75),rgba(38,42,96,0) 72%);animation:auroraC 19s ease-in-out infinite;will-change:transform;transform:translateZ(0)}
  /* Sheens/spin-glow: filter:blur() forces a full repaint of a large area
     every frame — expensive on lower-power hardware. Full-intensity blur
     restored to match the design; safe to do because these three are
     hidden entirely on touch/kiosk-class devices below (the QBIC tablet
     included), so the actual kiosk hardware never renders them at all —
     only desktop/preview viewing sees the stronger effect. */
  .aur-sheen1{position:absolute;left:0;top:-200px;width:340px;height:1500px;background:linear-gradient(90deg,rgba(145,132,217,0),rgba(145,132,217,.18) 45%,rgba(210,206,253,.30) 50%,rgba(145,132,217,.18) 55%,rgba(145,132,217,0));filter:blur(14px);animation:sheen 12s cubic-bezier(.45,0,.55,1) infinite;will-change:transform,opacity}
  .aur-sheen2{position:absolute;left:0;top:-200px;width:220px;height:1500px;background:linear-gradient(90deg,rgba(76,83,151,0),rgba(76,83,151,.34) 50%,rgba(76,83,151,0));filter:blur(20px);animation:sheen 17s cubic-bezier(.45,0,.55,1) infinite 8s;will-change:transform,opacity}
  .aur-spin{position:absolute;left:50%;top:38%;width:1700px;height:1700px;margin:-850px 0 0 -850px;background:conic-gradient(from 0deg,rgba(145,132,217,0) 0deg,rgba(145,132,217,.18) 55deg,rgba(145,132,217,0) 130deg,rgba(76,83,151,.18) 240deg,rgba(145,132,217,0) 330deg);filter:blur(50px);animation:spinGlow 55s linear infinite;will-change:transform}
  @media (hover:none) and (pointer:coarse){
    /* Previously hidden on touch/kiosk devices for performance — now
       shown everywhere per request. If the QBIC tablet's GPU struggles
       with these (blur filters are the most expensive part), this is
       the block to reintroduce. */
  }
  .aur-vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(22,24,38,0) 36%,rgba(22,24,38,.6) 100%)}
  .float-dot{position:absolute;bottom:0;border-radius:50%;will-change:transform,opacity}

  /* wall */
  #wall{position:absolute;left:0;top:0;right:0;transition:filter .5s ease,opacity .5s ease,transform .6s cubic-bezier(.4,0,.2,1);will-change:transform,opacity}
  /* Blurring the entire wall on every scan forces a full-canvas repaint —
     expensive on weaker GPUs. Opacity+scale reads as a very similar
     "defocus" cue for a fraction of the render cost. */
  #wall.blurred{opacity:.45;transform:scale(.985)}
  #wall-inner{position:relative;width:1920px;height:970px;padding:30px 72px 0;display:flex;flex-direction:column}

  .head-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
  .head-left{display:flex;align-items:center;gap:32px}
  .logo-box{position:relative;overflow:hidden}
  .logo-box img{width:270px;display:block;filter:brightness(2.15) saturate(1.15) drop-shadow(0 0 18px rgba(84,140,255,.45))}
  .logo-shine{position:absolute;top:0;left:-140%;width:55%;height:100%;background:linear-gradient(120deg,rgba(255,255,255,0),rgba(255,255,255,.55) 50%,rgba(255,255,255,0));mix-blend-mode:screen;animation:logoShine 4.5s ease-in-out infinite;pointer-events:none}
  .head-divider{width:1px;height:55px;background:linear-gradient(180deg,rgba(233,233,237,0),rgba(233,233,237,.22),rgba(233,233,237,0))}
  .head-eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#9397ab;margin-bottom:10px}
  .head-title{font-size:38px;font-weight:500;letter-spacing:-.015em;line-height:1.1}
  .head-right{display:flex;align-items:center;gap:28px}
  .head-date{font-size:15px;color:#9397ab;text-align:right}
  .head-count{font-size:15px;color:#9397ab;text-align:right}
  .head-count .n{color:#52c08c;font-weight:600}
  .head-clock{font-size:42px;font-weight:400;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

  #worker-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;justify-items:center;gap:18px 40px;overflow:hidden}
  #worker-grid::-webkit-scrollbar{width:0;background:transparent}

  .w-tile{width:420px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .w-ringwrap{position:relative;width:184px;height:184px;display:flex;align-items:center;justify-content:center}
  .w-ringwrap svg{position:absolute;inset:0}
  .w-avatar{position:relative;width:154px;height:154px;border-radius:50%;overflow:hidden;background:#232532;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #3f424d}
  .w-avatar::before{content:'';position:absolute;width:154px;height:154px;border-radius:50%;background:repeating-linear-gradient(135deg,rgba(147,151,171,.10) 0 6px,rgba(147,151,171,0) 6px 12px)}
  .w-avatar span{position:relative;font-size:42px;font-weight:500;color:#75798c;letter-spacing:.02em}
  .w-flag{animation:flagPulse 1.8s ease-in-out infinite;border-radius:50%}
  .w-name{font-size:23px;font-weight:500;letter-spacing:-.01em;line-height:1.1;text-align:center;margin:0}
  .w-caption{font-size:14px;margin-top:5px;margin-bottom:0;line-height:1.1;text-align:center;font-weight:500}

  /* hero overlay */
  #hero{position:absolute;left:0;top:0;width:1920px;height:860px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .45s ease}
  #hero.show{opacity:1;pointer-events:auto}
  #hero-inner{display:flex;flex-direction:column;align-items:center;transform-origin:center 190px;transition:transform .62s cubic-bezier(.34,.01,.2,1)}
  .hero-ringwrap{position:relative;width:360px;height:360px;display:flex;align-items:center;justify-content:center}
  .hero-glow{position:absolute;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(145,132,217,.28),rgba(145,132,217,0) 62%)}
  .hero-ringwrap svg{position:absolute;inset:0}
  .hero-avatar{position:relative;width:300px;height:300px;border-radius:50%;overflow:hidden;background:#232532;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #595d6c,0 16px 40px rgba(0,0,0,.65)}
  .hero-avatar::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(147,151,171,.10) 0 8px,rgba(147,151,171,0) 8px 16px)}
  .hero-avatar span{position:relative;font-size:86px;font-weight:500;color:#9397ab}
  .hero-name{font-size:42px;font-weight:500;letter-spacing:-.02em;text-align:center;margin-top:30px}
  .hero-note{font-size:19px;margin-top:12px;letter-spacing:.05em;text-transform:uppercase;text-align:center}

  .hero-admin-link{margin-top:22px;font-size:14px;color:#9184d9;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit}

  /* bottom strip */
  #strip{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,rgba(35,37,50,.85),rgba(22,24,38,.95));border-top:1px solid #3f424d;display:flex;align-items:center;justify-content:space-between;padding:0 72px;overflow:hidden}
  .strip-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 18% 50%,rgba(145,132,217,.35),rgba(145,132,217,0) 60%);opacity:0;transition:opacity .5s ease,box-shadow .5s ease}
  .strip-glow.show{opacity:1;box-shadow:inset 0 1px 0 #9184d9,0 -18px 60px rgba(145,132,217,.35)}
  .strip-left{position:relative;display:flex;align-items:center;gap:22px}
  .reader-dot-wrap{position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center}
  .reader-pulse{position:absolute;width:52px;height:52px;border-radius:50%;border:1px solid #5d5294;animation:readerPulse 2.4s ease-out infinite}
  .reader-dot{width:16px;height:16px;border-radius:50%;background:#9184d9;box-shadow:0 0 14px rgba(145,132,217,.8)}
  .strip-title{font-size:23px;font-weight:500}
  .strip-sub{font-size:14px;color:#75798c;margin-top:4px}
  .strip-right{position:relative;display:flex;align-items:center;gap:26px}
  .legend-item{display:flex;align-items:center;gap:10px;font-size:14px;color:#9397ab}
  .legend-swatch-half{width:24px;height:24px;border-radius:50%;border:3px solid #52c08c;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
  .legend-swatch-full{width:24px;height:24px;border-radius:50%;border:3px solid #52c08c}
  #statusMsg{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:14px;font-weight:600;color:#9397ab;z-index:20}
</style>
</head>
<body>

<div id="stage-outer">
  <div id="stage">
    <div id="connectionBanner"></div>

    <div id="aurora">
      <div class="aur-a"></div>
      <div class="aur-b"></div>
      <div class="aur-c"></div>
      <div class="aur-sheen1"></div>
      <div class="aur-sheen2"></div>
      <div class="aur-spin"></div>
      <div class="float-dot" style="left:14%;width:3px;height:3px;background:#b5abfc;box-shadow:0 0 10px rgba(181,171,252,.9);animation:floatUp 15s linear infinite"></div>
      <div class="float-dot" style="left:39%;width:2px;height:2px;background:#d2cefd;box-shadow:0 0 8px rgba(210,206,253,.8);animation:floatUp 21s linear infinite 6s"></div>

      <div class="float-dot" style="left:6%;width:3px;height:3px;background:#d2cefd;box-shadow:0 0 13px #d2cefdcc;animation:floatUp 18s linear infinite 1s"></div>
      <div class="float-dot" style="left:22%;width:2px;height:2px;background:#9184d9;box-shadow:0 0 10px #9184d9cc;animation:floatUp 26s linear infinite 9s"></div>
      <div class="float-dot" style="left:30%;width:4px;height:4px;background:#b5abfc;box-shadow:0 0 16px #b5abfccc;animation:floatUp 20s linear infinite 4s"></div>
      <div class="float-dot" style="left:47%;width:2px;height:2px;background:#d2cefd;box-shadow:0 0 10px #d2cefdcc;animation:floatUp 29s linear infinite 15s"></div>
      <div class="float-dot" style="left:54%;width:3px;height:3px;background:#9184d9;box-shadow:0 0 13px #9184d9cc;animation:floatUp 17s linear infinite 7s"></div>
      <div class="float-dot" style="left:71%;width:2px;height:2px;background:#b5abfc;box-shadow:0 0 10px #b5abfccc;animation:floatUp 23s linear infinite 11s"></div>
      <div class="float-dot" style="left:76%;width:4px;height:4px;background:#d2cefd;box-shadow:0 0 16px #d2cefdcc;animation:floatUp 19s linear infinite 2s"></div>
      <div class="float-dot" style="left:89%;width:3px;height:3px;background:#9184d9;box-shadow:0 0 13px #9184d9cc;animation:floatUp 27s linear infinite 17s"></div>
      <div class="float-dot" style="left:95%;width:2px;height:2px;background:#b5abfc;box-shadow:0 0 10px #b5abfccc;animation:floatUp 22s linear infinite 6s"></div>
      <div class="float-dot" style="left:18%;width:2px;height:2px;background:#b5abfc;box-shadow:0 0 10px #b5abfccc;animation:floatUp 31s linear infinite 21s"></div>
      <div class="float-dot" style="left:59%;width:3px;height:3px;background:#d2cefd;box-shadow:0 0 13px #d2cefdcc;animation:floatUp 25s linear infinite 13s"></div>
      <div class="float-dot" style="left:85%;width:2px;height:2px;background:#9184d9;box-shadow:0 0 10px #9184d9cc;animation:floatUp 20s linear infinite 19s"></div>
      <div class="aur-vign"></div>
    </div>


    <div id="wall">
      <div id="wall-inner">
        <div class="head-row">
          <div class="head-left">

<script>
// ============================================================
// ESD Check-in Kiosk — Wall Display
// Wired to backend/app.py (Flask + SQLite) on this same origin.
// ============================================================
const API_URL = window.location.origin;
const T_RISE = 620, T_RING = 1100, T_HOLD_OK = 2600, T_HOLD_ERR = 3200, T_FALL = 640;

// ── QBIC LED control ──
const LED_ENDPOINT = 'http://localhost:8080/v1/led/side_led';
function setLED(red, green, blue) {
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', LED_ENDPOINT, true);
    xhr.setRequestHeader('Content-type', 'application/json; charset=utf-8');
    xhr.send(JSON.stringify({ red, green, blue }));
  } catch (e) { console.warn('LED call failed:', e); }
}
const LED_COLORS = { default: [3,64,147], success: [0,150,0], failure: [255,0,0] };
setLED(...LED_COLORS.default);

let ledBreathInterval = null;
function breatheLED(r, g, b) {
  if (ledBreathInterval) clearInterval(ledBreathInterval);
  let step = 0, rising = true;
  const steps = 40;
  ledBreathInterval = setInterval(() => {
    const factor = rising ? step / steps : (steps - step) / steps;
    const scale = 0.1 + (factor * 0.9);
    setLED(Math.round(r*scale), Math.round(g*scale), Math.round(b*scale));
    step++;
    if (step > steps) { step = 0; rising = !rising; }
  }, 50);
}

async function updateLedStatus() {
  try {
    const [uRes, lRes] = await Promise.all([
      fetch(`${API_URL}/api/users`),
      fetch(`${API_URL}/api/logs?filter=daily&per_page=500`)
    ]);
    const users = await uRes.json();
    const logData = await lRes.json();
    const logs = (logData.logs || []).filter(l => !l.admin_logged);
    const active = Array.isArray(users) ? users.filter(u => u.active) : [];
    if (!active.length) { breatheLED(3,64,147); return; }
    const logMap = {};
    logs.forEach(l => { if (!logMap[l.user_id]) logMap[l.user_id] = l; });
    const passed = active.filter(u => logMap[u.id]?.status === 'pass').length;
    const failed = active.filter(u => logMap[u.id]?.status === 'fail').length;
    const total = active.length;
    if (passed === total) breatheLED(0,150,0);
    else if (failed > 0) breatheLED(255,60,0);
    else if (passed === 0) breatheLED(180,0,0);
    else breatheLED(255,60,0);
  } catch(e) {
    console.warn('LED update failed:', e);
    breatheLED(3,64,147);
  }
}
setInterval(updateLedStatus, 30000);
updateLedStatus();

// ── Stage scaling — matches the confirmed-good approach from the design:
// uniform scale-to-fit, centered, with the outer wrapper's background
// identical to the stage's background so any small margin is invisible
// rather than showing as a bar. ──
function fitStage() {
  const outer = document.getElementById('stage-outer');
  const stage = document.getElementById('stage');
  const vw = window.innerWidth || document.documentElement.clientWidth || outer.parentElement.clientWidth || 1920;
  const vh = window.innerHeight || document.documentElement.clientHeight || outer.parentElement.clientHeight || 1080;
  outer.style.width = vw + 'px';
  outer.style.height = vh + 'px';

  const scale = Math.min(vw / 1920, vh / 1080) || 1;
  const scaledW = 1920 * scale;
  const scaledH = 1080 * scale;
  // Exact centering computed by hand — left/top offsets, then scale from
  // the top-left corner. No flexbox, no transform-origin math to get
  // wrong: this is the same arithmetic on every browser/window size.
  const left = (vw - scaledW) / 2;
  const top = (vh - scaledH) / 2;
  stage.style.transform = `translate(${left}px, ${top}px) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);
window.addEventListener('load', fitStage);
document.addEventListener('DOMContentLoaded', fitStage);
[0, 100, 300, 800].forEach(ms => setTimeout(fitStage, ms));
if (window.ResizeObserver) {
  new ResizeObserver(fitStage).observe(document.body);
  new ResizeObserver(fitStage).observe(document.getElementById('stage-outer'));
}
fitStage();

// ── Clock / date ──
function tickClock() {
  const now = new Date();
  const estNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  let h = estNow.getHours();
  const m = estNow.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  document.getElementById('headClock').textContent = `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  document.getElementById('headDate').textContent = estNow.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}
tickClock();
setInterval(tickClock, 15000);

// ── Worker grid state ──
let workerState = []; // [{id, name, initials, ringColor, offset, caption, captionColor, flagged}]
let phase = 'idle'; // idle | rise | decide | busy | result | fall
let activeUser = null;
let tileEls = {}; // id -> DOM element

function initials(name) {
  return name.split(' ').map(s => s[0]).join('').toUpperCase();
}

function isAfternoonWindow(estNow) {
  const h = estNow.getHours(), m = estNow.getMinutes();
  return h > 13 || (h === 13 && m >= 15);
}

function parseHourFromLocalTime(timeStr) {
  const match = (timeStr || '').match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!match) return null;
  let h = parseInt(match[1]);
  const ampm = match[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return h;
}

async function loadWorkerGrid() {
  const grid = document.getElementById('worker-grid');
  try {
    const [uRes, lRes] = await Promise.all([
      fetch(`${API_URL}/api/users`),
      fetch(`${API_URL}/api/logs?filter=daily&per_page=500`)
    ]);
    const users = await uRes.json();
    const logData = await lRes.json();
    const logs = (logData.logs || []).filter(l => !l.admin_logged);

    const now = new Date();
    const estNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const afterLunch = isAfternoonWindow(estNow);

    const morningMap = {}, afternoonMap = {};
    for (const l of logs) {
      const h = parseHourFromLocalTime(l.local_time);
      const isAfternoon = h !== null && h >= 13;
      const map = isAfternoon ? afternoonMap : morningMap;
      if (!map[l.user_id]) map[l.user_id] = l; // logs sorted desc from API -> first is latest
    }

    const active = Array.isArray(users) ? users.filter(u => u.active) : [];

    workerState = active.map(u => {
      const ml = morningMap[u.id];
      const al = afternoonMap[u.id];
      const amPass = ml?.status === 'pass';
      const pmPass = al?.status === 'pass';

      let ring, caption, captionColor, off;
      if (u.is_flagged) {
        ring = '#e5484d'; caption = 'Flagged — see admin'; captionColor = '#f5a4a7';
        off = pmPass ? 0 : amPass ? 0.5 : 1;
      } else if (pmPass) {
        ring = '#52c08c'; caption = 'AM + PM logged'; captionColor = '#52c08c'; off = 0;
      } else if (amPass) {
        if (afterLunch) { ring = '#c9a14f'; caption = 'PM check due'; captionColor = '#d8b768'; }
        else { ring = '#52c08c'; caption = 'AM passed'; captionColor = '#52c08c'; }
        off = 0.5;
      } else if (ml?.status === 'fail' || al?.status === 'fail') {
        ring = '#e5484d'; caption = 'Check failed — retry'; captionColor = '#f5a4a7'; off = 1;
      } else {
        ring = '#3f424d'; caption = 'Not checked in'; captionColor = '#75798c'; off = 1;
      }

      return {
        id: u.id, name: u.name, initials: initials(u.name),
        ring, off, caption, captionColor, flagged: !!u.is_flagged
      };
    });

    document.getElementById('doneCount').textContent = workerState.filter(w => w.off === 0).length;
    document.getElementById('totalCount').textContent = ` of ${workerState.length} complete`;

    grid.innerHTML = '';
    tileEls = {};
    workerState.forEach(w => {
      const tile = document.createElement('div');
      tile.className = 'w-tile';
      tile.dataset.userId = w.id;
      tile.innerHTML = `
        <div class="w-ringwrap">
          <svg width="184" height="184" viewBox="0 0 184 184">
            <circle cx="92" cy="92" r="87" fill="none" stroke="#2f3140" stroke-width="6"></circle>
            <circle cx="92" cy="92" r="87" fill="none" stroke="${w.ring}" stroke-width="6" stroke-linecap="round"
              pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${w.off}"
              transform="rotate(-90 92 92)" style="filter:drop-shadow(0 0 8px rgba(82,192,140,.4))"></circle>
          </svg>
          <div class="w-avatar ${w.flagged ? 'w-flag' : ''}"><span>${w.initials}</span></div>
        </div>
        <div class="w-name">${w.name}</div>
        <div class="w-caption" style="color:${w.captionColor}">${w.caption}</div>
      `;
      grid.appendChild(tile);
      tileEls[w.id] = tile;
    });

    if (!active.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#75798c;font-size:16px;padding:2rem">No active users found</div>';
    }
  } catch (e) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#e5484d;font-size:16px;padding:2rem">ESD app offline</div>';
    console.error('loadWorkerGrid error:', e);
  }
}
loadWorkerGrid();
setInterval(loadWorkerGrid, 30000);

// ── Status message (top strip) ──
function showStatusMsg(text, color) {
  const el = document.getElementById('statusMsg');
  el.textContent = text || '';
  el.style.color = color || '#9397ab';
}

// ── Hero animation state machine ──
const heroEl = document.getElementById('hero');
const heroInner = document.getElementById('hero-inner');
const heroRing = document.getElementById('heroRing');
const heroInitialsEl = document.getElementById('heroInitials');
const heroNameEl = document.getElementById('heroName');
const heroNoteEl = document.getElementById('heroNote');
const heroAdminBtn = document.getElementById('heroAdminBtn');
const wallEl = document.getElementById('wall');
const auroraEl = document.getElementById('aurora');
const stripTitleEl = document.getElementById('stripTitle');
const stripGlowEl = document.getElementById('stripGlow');

function setScanningVisual(on) {
  wallEl.classList.toggle('blurred', on);
  auroraEl.classList.toggle('blurred', on);
  stripGlowEl.classList.toggle('show', on);
  stripTitleEl.textContent = on ? 'Badge accepted — hold still' : 'Tap your badge on the reader';
  stripTitleEl.style.color = on ? '#b5abfc' : '#e9e9ed';
}

function tileRectRelativeToStage(tile) {
  const stage = document.getElementById('stage');
  const outer = document.getElementById('stage-outer');
  const vw = outer.clientWidth || window.innerWidth || 1920;
  const vh = outer.clientHeight || window.innerHeight || 1080;
  const scale = Math.min(vw / 1920, vh / 1080) || 1;
  const stageRect = stage.getBoundingClientRect();
  const tileRect = tile.getBoundingClientRect();
  return {
    cx: (tileRect.left - stageRect.left) / scale + (tileRect.width / scale) / 2,
    cy: (tileRect.top - stageRect.top) / scale + 92
  };
}

function resetHero() {
  heroEl.classList.remove('show');
  heroInner.style.transition = 'none';
  heroInner.style.transform = '';
  heroAdminBtn.style.display = 'none';
  heroNoteEl.textContent = '';
  setScanningVisual(false);
  showStatusMsg('');
}

async function beginScanFlow(user) {
  if (phase !== 'idle') return;
  phase = 'rise';
  activeUser = user;
  showStatusMsg('');
  setScanningVisual(true);

  const w = workerState.find(x => x.id === user.id);
  const tile = tileEls[user.id];

  heroInitialsEl.textContent = initials(user.name);
  heroNameEl.textContent = user.name;
  heroNoteEl.textContent = 'Badge read';
  heroNoteEl.style.color = '#b2b6ca';
  heroRing.setAttribute('stroke', w ? w.ring : '#52c08c');
  heroRing.style.strokeDashoffset = w ? w.off : 1;
  heroAdminBtn.style.display = 'none';

  let dx = 0, dy = 0, s = 184/360;
  if (tile) {
    const r = tileRectRelativeToStage(tile);
    dx = r.cx - 960; dy = r.cy - 430;
  }

  heroInner.style.transition = 'none';
  heroInner.style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
  heroEl.classList.add('show');
  // force reflow then animate to center
  void heroInner.offsetHeight;
  heroInner.style.transition = 'transform .62s cubic-bezier(.34,.01,.2,1)';
  requestAnimationFrame(() => { heroInner.style.transform = 'translate(0px,0px) scale(1)'; });

  // Badge scan = automatic Pass. No Pass/Fail prompt — a scan is the
  // check. (Fail can still be recorded administratively via /admin if
  // someone needs to be flagged for an ESD issue.)
  setTimeout(() => { autoLogPass(user); }, T_RISE + 60);
}

heroAdminBtn.addEventListener('click', () => { window.location.href = `${API_URL}/admin`; });

async function autoLogPass(user) {
  phase = 'busy';
  heroNoteEl.textContent = 'Logging check…';
  heroNoteEl.style.color = '#9184d9';
  heroRing.setAttribute('stroke', '#9184d9');

  // Pre-check: already passed this window? Don't re-submit, just confirm.
  try {
    const res = await fetch(`${API_URL}/api/logs/${user.id}?filter=daily`);
    const logs = await res.json();
    const passLog = Array.isArray(logs) ? logs.find(l => l.status === 'pass' && !l.admin_logged) : null;
    if (passLog) {
      const now = new Date();
      const estNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
      const afterLunch = isAfternoonWindow(estNow);
      const passHour = parseHourFromLocalTime(passLog.local_time);
      const passWasAfternoon = passHour !== null && passHour >= 13;
      if (afterLunch === passWasAfternoon) {
        heroNoteEl.textContent = `Already passed at ${passLog.local_time}`;
        heroNoteEl.style.color = '#52c08c';
        heroRing.setAttribute('stroke', '#52c08c');
        heroRing.style.strokeDashoffset = 0;
        finishHero(true);
        return;
      }
    }
  } catch (e) { console.warn('pre-check failed', e); }

  let res, msg;
  try {
    res = await fetch(`${API_URL}/api/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: user.id, status: 'pass' })
    });
    msg = await res.json().catch(() => ({}));
  } catch (e) {
    heroNoteEl.textContent = 'Connection error — try again';
    heroNoteEl.style.color = '#e5484d';
    heroRing.setAttribute('stroke', '#e5484d');
    setLED(...LED_COLORS.failure);
    finishHero(false);
    return;
  }

  if (!res.ok || msg.error) {
    if (res.status === 409 && msg.last_log) {
      heroNoteEl.textContent = `Already logged at ${msg.last_log}`;
      heroNoteEl.style.color = '#52c08c';
      heroRing.setAttribute('stroke', '#52c08c');
      heroRing.style.strokeDashoffset = 0;
      finishHero(true);
      return;
    }
    if (msg.flagged) {
      heroNoteEl.textContent = 'Flagged for ESD issues — see administrator';
    } else {
      heroNoteEl.textContent = msg.error || 'Could not log check';
    }
    heroNoteEl.style.color = '#e5484d';
    heroRing.setAttribute('stroke', '#e5484d');
    setLED(...LED_COLORS.failure);
    finishHero(false);
    return;
  }

  const w = workerState.find(x => x.id === user.id);
  const target = (w && w.off === 0.5) ? 0 : 0.5; // if AM already done -> completing to 0 (full); else half
  heroRing.setAttribute('stroke', '#52c08c');
  setTimeout(() => { heroRing.style.strokeDashoffset = target; }, 30);
  heroNoteEl.textContent = `Passed at ${msg.local_time}`;
  heroNoteEl.style.color = '#52c08c';
  if (user.is_admin) heroAdminBtn.style.display = 'block';
  setLED(...LED_COLORS.success);
  finishHero(true);
}

function finishHero(ok) {
  phase = 'result';
  const hold = ok ? T_HOLD_OK : T_HOLD_ERR;
  setTimeout(() => {
    phase = 'fall';
    heroInner.style.transition = 'transform .62s cubic-bezier(.34,.01,.2,1)';
    const tile = tileEls[activeUser ? activeUser.id : null];
    let dx = 0, dy = 0, s = 184/360;
    if (tile) {
      const r = tileRectRelativeToStage(tile);
      dx = r.cx - 960; dy = r.cy - 430;
    }
    heroInner.style.transform = `translate(${dx}px,${dy}px) scale(${s})`;
    setTimeout(() => {
      resetHero();
      phase = 'idle';
      activeUser = null;
      loadWorkerGrid();
      setLED(...LED_COLORS.default);
    }, T_FALL);
  }, hold);
}

// ── Badge scanning (keyboard-wedge reader) ──
let badgeBuffer = '';
let badgeTimeout = null;

document.addEventListener('keydown', (event) => {
  if (phase !== 'idle') return;

  if (event.key === 'Enter') {
    if (badgeBuffer.length > 0) {
      handleBadgeScan(badgeBuffer.trim());
      badgeBuffer = '';
    }
    return;
  }
  if (event.key.length !== 1) return;
  badgeBuffer += event.key;
  if (badgeTimeout) clearTimeout(badgeTimeout);
  badgeTimeout = setTimeout(() => {
    if (badgeBuffer.length > 0) {
      handleBadgeScan(badgeBuffer.trim());
      badgeBuffer = '';
    }
  }, 200);
});

async function handleBadgeScan(badgeId) {
  if (phase !== 'idle') return;
  showStatusMsg('Identifying badge…', '#9397ab');
  try {
    const response = await fetch(`${API_URL}/api/users/badge/${encodeURIComponent(badgeId)}`);
    if (response.ok) {
      const user = await response.json();
      showStatusMsg('');
      beginScanFlow(user);
    } else {
      const err = await response.json().catch(() => ({}));
      showStatusMsg(err.flagged ? 'ESD issue detected — please see administrator.' : '❌ Badge not recognized. Contact administrator.', '#e5484d');
      setLED(...LED_COLORS.failure);
      setTimeout(() => { showStatusMsg(''); setLED(...LED_COLORS.default); }, 3000);
    }
  } catch (e) {
    showStatusMsg('❌ Connection error. Please try again.', '#e5484d');
    setLED(...LED_COLORS.failure);
    setTimeout(() => { showStatusMsg(''); setLED(...LED_COLORS.default); }, 3000);
  }
}

// ── Connection monitoring ──
let connectionLost = false;
let heartbeatInterval;
let reconnectAttempts = 0;
const MAX_RECONNECT_ATTEMPTS = 5;

async function checkServerConnection() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 3000);
    const response = await fetch(`${API_URL}/api/users`, { method: 'GET', signal: controller.signal });
    clearTimeout(timeoutId);
    if (response.ok) {
      if (connectionLost) showReconnected();
      connectionLost = false;
      reconnectAttempts = 0;
      return true;
    }
    throw new Error('Server returned error');
  } catch (error) {
    if (!connectionLost) showConnectionLost();
    connectionLost = true;
    reconnectAttempts++;
    if (reconnectAttempts > MAX_RECONNECT_ATTEMPTS) {
      clearInterval(heartbeatInterval);
      heartbeatInterval = setInterval(checkServerConnection, 10000);
    }
    return false;
  }
}

function showConnectionLost() {
  const banner = document.getElementById('connectionBanner');
  banner.className = 'show';
  banner.textContent = 'Lost connection to server — attempting to reconnect...';
  setLED(...LED_COLORS.failure);
}

function showReconnected() {
  const banner = document.getElementById('connectionBanner');
  banner.className = 'show reconnected';
  banner.textContent = '✓ Connection restored!';
  setLED(...LED_COLORS.default);
  setTimeout(() => { banner.className = ''; }, 3000);
  clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(checkServerConnection, 5000);
}

heartbeatInterval = setInterval(checkServerConnection, 5000);
checkServerConnection();

// No auto-focus to prevent on-screen keyboard on kiosks

</script>
